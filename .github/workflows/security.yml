name: Security & Privacy Audits

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Weekly security audit
  workflow_dispatch:

jobs:
  security-audit:
    name: Secret Leak, SAST & Privacy Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Pre-populate Pub Cache and Dependencies
        run: |
          docker run --rm -v "${PWD}:/app" -e PUB_CACHE=/app/.pub-cache -w /app/tests ghcr.io/cirruslabs/flutter:stable dart pub get

      - name: Offline Privacy Invariant Verification
        run: |
          docker run --rm --network none -v "${PWD}:/app" -e PUB_CACHE=/app/.pub-cache -w /app/tests ghcr.io/cirruslabs/flutter:stable dart test offline
