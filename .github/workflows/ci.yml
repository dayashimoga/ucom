name: CI/CD Multi-Platform Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-coverage:
    name: Test & Coverage Gate (>=90%)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: /root/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        run: |
          cd packages/contracts && dart pub get
          cd ../shared && dart pub get
          cd ../../services/ai_core && dart pub get
          cd ../reporting && dart pub get
          cd ../model_runtime && dart pub get
          cd ../../tests && dart pub get
          cd ../apps/unicom && flutter pub get

      - name: Static Analysis & Linting
        run: |
          cd packages/contracts && dart analyze --fatal-infos
          cd ../shared && dart analyze --fatal-infos
          cd ../../services/ai_core && dart analyze --fatal-infos
          cd ../reporting && dart analyze --fatal-infos
          cd ../model_runtime && dart analyze --fatal-infos
          cd ../../tests && dart analyze --fatal-infos
          cd ../apps/unicom && flutter analyze --fatal-infos

      - name: Run Flutter App Tests with Coverage
        run: |
          cd apps/unicom
          flutter test --coverage

      - name: Run Backend Test Suite with Branch Coverage
        run: |
          cd tests
          dart test --coverage=coverage unit contract integration offline security performance e2e benchmarks
          dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --packages=.dart_tool/package_config.json --report-on=../packages,../services

      - name: Enforce >=90% Line & Branch Coverage Gate Across Monorepo
        run: |
          dart run tests/coverage/check_coverage.dart tests/coverage/lcov.info apps/unicom/coverage/lcov.info

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-lcov-reports
          path: |
            tests/coverage/lcov.info
            apps/unicom/coverage/lcov.info

  build-android:
    name: Build Android Release (APK & AAB)
    needs: [ test-and-coverage ]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: cd apps/unicom && flutter pub get

      - name: Build Release APK
        run: cd apps/unicom && flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release AppBundle (AAB)
        run: cd apps/unicom && flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unicom-android-release
          path: |
            apps/unicom/build/app/outputs/flutter-apk/app-release.apk
            apps/unicom/build/app/outputs/bundle/release/app-release.aab

  build-web:
    name: Build Web Production Bundle
    needs: [ test-and-coverage ]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: cd apps/unicom && flutter pub get

      - name: Build Web Release
        run: cd apps/unicom && flutter build web --release

      - name: Package Web Bundle
        run: tar -czf unicom-web-v1.0.0.tar.gz -C apps/unicom/build/web .

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicom-web-bundle
          path: unicom-web-v1.0.0.tar.gz

  build-windows:
    name: Build Windows Desktop Release
    needs: [ test-and-coverage ]
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: cd apps/unicom; flutter pub get

      - name: Build Windows Release
        run: cd apps/unicom; flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicom-windows-release
          path: apps/unicom/build/windows/x64/runner/Release/

  build-linux:
    name: Build Linux Desktop Release
    needs: [ test-and-coverage ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: cd apps/unicom && flutter pub get

      - name: Build Linux Release
        run: cd apps/unicom && flutter build linux --release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicom-linux-release
          path: apps/unicom/build/linux/x64/release/bundle/

  build-macos:
    name: Build macOS Desktop Bundle
    needs: [ test-and-coverage ]
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: cd apps/unicom && flutter pub get

      - name: Build macOS Release
        run: cd apps/unicom && flutter build macos --release

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicom-macos-release
          path: apps/unicom/build/macos/Build/Products/Release/
